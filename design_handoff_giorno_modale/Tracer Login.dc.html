<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: #10171a; }
    a { color: #7c6cf6; }
    a:hover { color: #9d8ffb; }
    ::placeholder { color: #6d7285; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</helmet>

<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #10171a; font-family: 'Plus Jakarta Sans', sans-serif; padding: 40px; box-sizing: border-box;">
  <div style="display: flex; width: 100%; max-width: 1280px; height: 780px; max-height: calc(100vh - 80px); background: #131c1f; border: 1px solid rgba(255,255,255,0.07); border-radius: 22px; overflow: auto; box-shadow: 0 30px 80px rgba(0,0,0,0.5);">

    <div style="flex: 1; padding: 44px 48px; display: flex; flex-direction: column; gap: 40px; min-width: 0;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <div style="width: 38px; height: 38px; border-radius: 11px; background: #7c6cf6; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px;">
          <span style="font-family: 'Space Grotesk', sans-serif; font-size: 19px; font-weight: 700; color: #ffffff;">Tracer</span>
          <span style="font-size: 10.5px; font-weight: 600; letter-spacing: 0.12em; color: #7d8296;">WORKOUT TRACKER</span>
        </div>
      </div>

      <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 28px;">
        <div style="display: flex; flex-direction: column; gap: 10px;">
          <div style="font-family: 'Space Grotesk', sans-serif; font-size: 38px; font-weight: 700; line-height: 1.12; color: #ffffff;">Traccia ogni<br /><span style="color: #9d8ffb;">progressione.</span></div>
          <div style="font-size: 15px; line-height: 1.5; color: #9ba0b3; max-width: 360px;">Storico allenamenti, analisi muscolare, trend di forza. Tutto in un posto.</div>
        </div>

        <div style="background: #182226; border: 1px solid rgba(255,255,255,0.06); border-radius: 16px; padding: 22px 24px; display: flex; flex-direction: column; gap: 16px;">
          <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.12em; color: #838a9e;">ATTIVITÀ RECENTE</span>
          <div onMouseEnter="{{ triggerWave }}" style="display: grid; grid-template-columns: repeat(15, 1fr); gap: 3px;">
            <sc-for list="{{ heatmap }}" as="cell" hint-placeholder-count="75">
              <div style="{{ cell.style }}"></div>
            </sc-for>
          </div>
          <div style="display: flex; gap: 10px;">
            <div style="flex: 1; display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 11px; padding: 10px 12px;">
              <div style="width: 28px; height: 28px; border-radius: 8px; background: rgba(124,108,246,0.18); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#a996ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle></svg>
              </div>
              <div style="display: flex; flex-direction: column;">
                <span style="font-size: 16px; font-weight: 700; color: #ffffff;">7</span>
                <span style="font-size: 10.5px; color: #838a9e;">gg streak</span>
              </div>
            </div>
            <div style="flex: 1; display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 11px; padding: 10px 12px;">
              <div style="width: 28px; height: 28px; border-radius: 8px; background: rgba(74,222,128,0.15); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="20" x2="12" y2="10"></line><line x1="18" y1="20" x2="18" y2="4"></line><line x1="6" y1="20" x2="6" y2="16"></line></svg>
              </div>
              <div style="display: flex; flex-direction: column;">
                <span style="font-size: 16px; font-weight: 700; color: #ffffff;">147</span>
                <span style="font-size: 10.5px; color: #838a9e;">sessioni</span>
              </div>
            </div>
            <div style="flex: 1; display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 11px; padding: 10px 12px;">
              <div style="width: 28px; height: 28px; border-radius: 8px; background: rgba(124,108,246,0.18); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#a996ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>
              </div>
              <div style="display: flex; flex-direction: column;">
                <span style="font-size: 16px; font-weight: 700; color: #ffffff;">35</span>
                <span style="font-size: 10.5px; color: #838a9e;">serie ieri</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div style="width: 1px; background: rgba(255,255,255,0.07);"></div>

    <div style="flex: 1; padding: 44px 48px; display: flex; flex-direction: column; justify-content: center; gap: 26px; min-width: 0; position: relative; overflow: hidden;">
      <div style="{{ orbStyle }}"></div>

      <div style="display: flex; flex-direction: column; gap: 6px; position: relative;">
        <span style="font-family: 'Space Grotesk', sans-serif; font-size: 27px; font-weight: 700; color: #ffffff;">Bentornato</span>
        <span style="font-size: 14.5px; color: #9ba0b3;">Inserisci le credenziali per continuare.</span>
      </div>

      <div style="display: flex; flex-direction: column; gap: 16px; position: relative;">
        <div style="display: flex; flex-direction: column; gap: 7px;">
          <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: #838a9e;">USERNAME</span>
          <div style="display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 12px 14px; transition: border-color 0.2s, box-shadow 0.2s;" style-focus="border-color: rgba(124,108,246,0.6); box-shadow: 0 0 0 3px rgba(124,108,246,0.15);">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7d8296" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <input type="text" placeholder="Il tuo username" style="background: transparent; border: none; outline: none; padding: 0; font-size: 14.5px; color: #ffffff; width: 100%; font-family: inherit;" />
          </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 7px;">
          <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: #838a9e;">PASSWORD</span>
          <div style="display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 12px 14px; transition: border-color 0.2s, box-shadow 0.2s;" style-focus="border-color: rgba(124,108,246,0.6); box-shadow: 0 0 0 3px rgba(124,108,246,0.15);">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7d8296" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            <input type="{{ passwordFieldType }}" placeholder="La tua password" style="background: transparent; border: none; outline: none; padding: 0; font-size: 14.5px; color: #ffffff; width: 100%; font-family: inherit;" />
            <svg onClick="{{ togglePassword }}" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7d8296" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; cursor: pointer;" style-hover="stroke: #c7cbd6;">
              <sc-if value="{{ showPassword }}" hint-placeholder-val="{{ false }}">
                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </sc-if>
              <sc-if value="{{ hidePassword }}" hint-placeholder-val="{{ true }}">
                <path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a21.86 21.86 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 7 11 7a21.86 21.86 0 0 1-2.16 3.19"></path>
                <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </sc-if>
            </svg>
          </div>
        </div>

        <div style="display: flex; align-items: center; justify-content: space-between;">
          <div onClick="{{ toggleRemember }}" style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
            <div style="{{ checkboxStyle }}">
              <sc-if value="{{ remember }}" hint-placeholder-val="{{ false }}">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
              </sc-if>
            </div>
            <span style="font-size: 13px; color: #9ba0b3;">Ricordami</span>
          </div>
        </div>

        <div onClick="{{ submit }}" style="{{ submitStyle }}">
          <sc-if value="{{ submitting }}" hint-placeholder-val="{{ false }}">
            <div style="width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.35); border-top-color: #fff; animation: spin 0.7s linear infinite;"></div>
          </sc-if>
          <span>{{ submitLabel }}</span>
        </div>
      </div>
    </div>

  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { wave: -10, running: false, showPassword: false, remember: false, submitting: false, submitted: false, orbT: 0 };

  componentDidMount() {
    this._schedule();
    this._orbInt = setInterval(() => {
      this.setState(s => ({ orbT: (s.orbT + 1) % 360 }));
    }, 60);
  }

  componentWillUnmount() {
    clearInterval(this._tick);
    clearTimeout(this._pause);
    clearInterval(this._orbInt);
    clearTimeout(this._submitTimeout);
  }

  togglePassword = () => this.setState(s => ({ showPassword: !s.showPassword }));
  toggleRemember = () => this.setState(s => ({ remember: !s.remember }));

  submit = () => {
    if (this.state.submitting || this.state.submitted) return;
    this.setState({ submitting: true });
    this._submitTimeout = setTimeout(() => {
      this.setState({ submitting: false, submitted: true });
      this._submitTimeout = setTimeout(() => this.setState({ submitted: false }), 1800);
    }, 1100);
  };

  _schedule() {
    this._pause = setTimeout(() => this._runWave(), 4000);
  }

  _runWave() {
    this.setState({ wave: -10, running: true });
    clearInterval(this._tick);
    this._tick = setInterval(() => {
      this.setState(s => {
        if (s.wave >= 90) {
          clearInterval(this._tick);
          this._schedule();
          return { wave: -10, running: false };
        }
        return { wave: s.wave + 1 };
      });
    }, 60);
  }

  triggerWave = () => {
    clearTimeout(this._pause);
    this._runWave();
  };

  renderVals() {
    const cols = 15;
    const heatmap = [];
    for (let i = 0; i < 75; i++) {
      const active = (i * 7 + 3) % 11 < 6 && i > 8;
      const intensity = (i * 5) % 3;
      const colors = ['rgba(124,108,246,0.9)', 'rgba(124,108,246,0.55)', 'rgba(124,108,246,0.28)'];
      const base = active ? colors[intensity] : 'rgba(255,255,255,0.05)';
      const col = i % cols;
      const dist = Math.abs(col - this.state.wave);
      const glow = dist < 3 ? (1 - dist / 3) : 0;
      const style = {
        width: '100%', aspectRatio: '1', borderRadius: '3px', background: base,
        transition: 'transform 0.15s, box-shadow 0.15s',
        transform: glow > 0 ? `scale(${1 + glow * 0.25})` : 'scale(1)',
        boxShadow: glow > 0 ? `0 0 ${6 + glow * 8}px rgba(157,143,251,${glow * 0.85})` : 'none'
      };
      heatmap.push({ style });
    }
    const orbX = 50 + Math.sin(this.state.orbT * Math.PI / 180) * 18;
    const orbY = 30 + Math.cos(this.state.orbT * Math.PI / 90) * 14;
    const orbStyle = {
      position: 'absolute', left: `${orbX}%`, top: `${orbY}%`, width: '380px', height: '380px',
      transform: 'translate(-50%, -50%)', borderRadius: '50%',
      background: 'radial-gradient(circle, rgba(124,108,246,0.16) 0%, rgba(124,108,246,0) 70%)',
      pointerEvents: 'none', transition: 'left 0.06s linear, top 0.06s linear'
    };

    const checkboxStyle = {
      width: '18px', height: '18px', borderRadius: '5px',
      background: this.state.remember ? '#7c6cf6' : 'rgba(255,255,255,0.05)',
      border: `1px solid ${this.state.remember ? '#7c6cf6' : 'rgba(255,255,255,0.15)'}`,
      display: 'flex', alignItems: 'center', justifyContent: 'center', transition: 'background 0.15s, border-color 0.15s'
    };

    const submitStyle = {
      background: this.state.submitted ? '#4ade80' : '#7c6cf6', color: '#fff', fontSize: '14.5px', fontWeight: 700,
      textAlign: 'center', padding: '13px', borderRadius: '10px', cursor: 'pointer',
      boxShadow: this.state.submitted ? '0 10px 24px rgba(74,222,128,0.3)' : '0 10px 24px rgba(124,108,246,0.3)',
      marginTop: '6px', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '8px',
      transition: 'background 0.2s, box-shadow 0.2s, transform 0.1s',
      transform: this.state.submitting ? 'scale(0.98)' : 'scale(1)'
    };

    const submitLabel = this.state.submitting ? 'Accesso in corso…' : (this.state.submitted ? 'Accesso effettuato ✓' : 'Entra in Tracer');

    return {
      heatmap, triggerWave: this.triggerWave,
      passwordFieldType: this.state.showPassword ? 'text' : 'password',
      togglePassword: this.togglePassword,
      showPassword: this.state.showPassword, hidePassword: !this.state.showPassword,
      remember: this.state.remember, toggleRemember: this.toggleRemember, checkboxStyle,
      submitting: this.state.submitting, submit: this.submit, submitStyle, submitLabel,
      orbStyle
    };
  }
}

</script>
</body>
</html>
