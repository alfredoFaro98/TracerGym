<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Tracer — Login Redesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body,#root{width:100%;height:100%;background:#080809;overflow:hidden}
  button,input{font-family:'Space Grotesk',sans-serif}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

/* ── tokens ── */
const C = {
  base:'#0c0c0e', surface:'#131316', elevated:'#1a1a1e',
  card:'#1f1f25', border:'#28282f', borderSub:'#1c1c22',
  text:'#eeeef2', textSec:'#6868a0', textMuted:'#3e3e56',
  accent:'#F07228', acDim:'rgba(240,114,40,0.12)', acMid:'rgba(240,114,40,0.30)',
  success:'#3dd68c',
};

/* ── mini icon ── */
const Ico = ({n,s=16,c='currentColor',sw=1.75})=>{
  const p={
    eye:<><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></>,
    eyeOff:<><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></>,
    user:<><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></>,
    lock:<><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></>,
    arrow:<><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></>,
    zap:<polyline points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>,
    fire:<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>,
    barChart:<><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></>,
    check:<polyline points="20 6 9 18 4 13"/>,
  };
  return <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round">{p[n]}</svg>;
};

/* ── Heatmap mini (for split variant) ── */
const MiniHeatmap = ()=>{
  const rows=7, cols=22;
  const seed=(r,c)=>((r*7+c*13)%17);
  const palette=['#1a1a22','rgba(240,114,40,0.20)','rgba(240,114,40,0.45)','rgba(240,114,40,0.75)','#F07228'];
  return(
    <div style={{display:'flex',gap:3}}>
      {Array.from({length:cols},(_,c)=>(
        <div key={c} style={{display:'flex',flexDirection:'column',gap:3}}>
          {Array.from({length:rows},(_,r)=>{
            const v=seed(r,c)%5;
            const active= c > 8 || (c>4 && r%2===0) || (c>2&&r===3);
            return <div key={r} style={{width:8,height:8,borderRadius:2,background:active?palette[v]:palette[0]}}/>;
          })}
        </div>
      ))}
    </div>
  );
};

/* ── Stat chip ── */
const Chip=({icon,val,label,color})=>(
  <div style={{display:'flex',alignItems:'center',gap:8,padding:'8px 12px',
    background:'rgba(255,255,255,0.05)',borderRadius:8,border:`1px solid rgba(255,255,255,0.07)`}}>
    <div style={{width:28,height:28,borderRadius:7,background:`rgba(${color},0.15)`,
      display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
      <Ico n={icon} s={14} c={`rgb(${color})`}/>
    </div>
    <div>
      <div style={{fontSize:16,fontWeight:700,color:C.text,letterSpacing:'-0.03em',lineHeight:1}}>{val}</div>
      <div style={{fontSize:9.5,color:C.textMuted,marginTop:1}}>{label}</div>
    </div>
  </div>
);

/* ── Input field ── */
const Field=({label,type,placeholder,icon,accent})=>{
  const [focused,setFocused]=React.useState(false);
  const [show,setShow]=React.useState(false);
  const acc=accent||C.accent;
  const t=show?'text':type;
  return(
    <div>
      <label style={{display:'block',fontSize:11.5,fontWeight:600,color:focused?acc:C.textMuted,
        marginBottom:6,letterSpacing:'0.03em',textTransform:'uppercase',transition:'color 0.15s'}}>
        {label}
      </label>
      <div style={{position:'relative'}}>
        <div style={{position:'absolute',left:13,top:'50%',transform:'translateY(-50%)',pointerEvents:'none'}}>
          <Ico n={icon} s={14} c={focused?acc:C.textMuted} sw={1.75}/>
        </div>
        <input
          type={t}
          placeholder={placeholder}
          onFocus={()=>setFocused(true)}
          onBlur={()=>setFocused(false)}
          style={{
            width:'100%',padding:'11px 40px 11px 38px',
            background:focused?'rgba(240,114,40,0.05)':C.elevated,
            border:`1.5px solid ${focused?acc:C.border}`,
            borderRadius:9,fontSize:13.5,color:C.text,
            outline:'none',transition:'border-color 0.15s, background 0.15s',
          }}
        />
        {type==='password'&&(
          <button onClick={()=>setShow(v=>!v)} style={{
            position:'absolute',right:12,top:'50%',transform:'translateY(-50%)',
            background:'none',border:'none',cursor:'pointer',padding:2,
          }}>
            <Ico n={show?'eyeOff':'eye'} s={14} c={C.textMuted}/>
          </button>
        )}
      </div>
    </div>
  );
};

/* ═══════════════════════════════════════════════════════
   VARIANTE A — Centered, Premium
   Card elevata, sfondo ambientale, gerarchia forte
═══════════════════════════════════════════════════════ */
const LoginA=({accent})=>{
  const [hovBtn,setHovBtn]=React.useState(false);
  const acc=accent||C.accent;
  return(
    <div style={{
      width:1440,height:900,position:'relative',overflow:'hidden',
      background:C.base,fontFamily:"'Space Grotesk',sans-serif",
      display:'flex',alignItems:'center',justifyContent:'center',
    }}>
      {/* Ambient glow */}
      <div style={{
        position:'absolute',width:600,height:600,borderRadius:'50%',
        background:`radial-gradient(circle, rgba(240,114,40,0.08) 0%, transparent 70%)`,
        top:'50%',left:'50%',transform:'translate(-50%,-50%)',pointerEvents:'none',
      }}/>
      {/* Subtle dot grid */}
      <svg style={{position:'absolute',inset:0,width:'100%',height:'100%',opacity:0.15}} xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="dotgrid" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="1" fill="#3e3e56"/>
          </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#dotgrid)"/>
      </svg>

      {/* Card */}
      <div style={{
        position:'relative',zIndex:1,
        width:420,background:C.surface,
        borderRadius:20,border:`1px solid ${C.border}`,
        padding:'40px 40px 36px',
        boxShadow:`0 0 0 1px rgba(255,255,255,0.03), 0 40px 80px rgba(0,0,0,0.6)`,
      }}>
        {/* Logo */}
        <div style={{display:'flex',flexDirection:'column',alignItems:'center',marginBottom:36,gap:10}}>
          <div style={{
            width:56,height:56,borderRadius:16,
            background:`linear-gradient(135deg, #FF8A40 0%, #D05818 100%)`,
            display:'flex',alignItems:'center',justifyContent:'center',
            boxShadow:`0 8px 24px rgba(240,114,40,0.35)`,
          }}>
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2.2" strokeLinecap="round">
              <path d="M6 5v14M18 5v14M6 12h12M3 8h3M18 8h3M3 16h3M18 16h3"/>
            </svg>
          </div>
          <div style={{textAlign:'center'}}>
            <div style={{fontSize:22,fontWeight:700,color:C.text,letterSpacing:'-0.025em'}}>Tracer</div>
            <div style={{fontSize:10,fontWeight:600,color:C.textMuted,letterSpacing:'0.14em',textTransform:'uppercase',marginTop:2}}>Workout Tracker</div>
          </div>
        </div>

        {/* Titolo */}
        <div style={{marginBottom:28}}>
          <h1 style={{fontSize:20,fontWeight:700,color:C.text,letterSpacing:'-0.02em',marginBottom:4}}>Bentornato</h1>
          <p style={{fontSize:13,color:C.textMuted}}>Inserisci le tue credenziali per accedere.</p>
        </div>

        {/* Form */}
        <div style={{display:'flex',flexDirection:'column',gap:18,marginBottom:10}}>
          <Field label="Username" type="text" placeholder="Il tuo username" icon="user" accent={acc}/>
          <Field label="Password" type="password" placeholder="••••••••" icon="lock" accent={acc}/>
        </div>

        {/* Forgot */}
        <div style={{textAlign:'right',marginBottom:26}}>
          <a href="#" style={{fontSize:11.5,color:C.textSec,textDecoration:'none',
            borderBottom:`1px solid ${C.border}`}}>Password dimenticata?</a>
        </div>

        {/* CTA */}
        <button
          onMouseEnter={()=>setHovBtn(true)}
          onMouseLeave={()=>setHovBtn(false)}
          style={{
            width:'100%',padding:'13px',display:'flex',alignItems:'center',
            justifyContent:'center',gap:8,
            background:hovBtn?`#D96420`:acc,
            border:'none',borderRadius:10,
            fontSize:14,fontWeight:700,color:'#fff',cursor:'pointer',
            transition:'background 0.15s',
            boxShadow:`0 4px 18px rgba(240,114,40,0.30)`,
            letterSpacing:'-0.01em',
          }}>
          Entra
          <Ico n="arrow" s={15} c="rgba(255,255,255,0.8)" sw={2}/>
        </button>

        {/* Divider */}
        <div style={{display:'flex',alignItems:'center',gap:12,margin:'24px 0'}}>
          <div style={{flex:1,height:1,background:C.border}}/>
          <span style={{fontSize:10.5,color:C.textMuted,fontWeight:500}}>Accesso sicuro</span>
          <div style={{flex:1,height:1,background:C.border}}/>
        </div>

        {/* Trust badges */}
        <div style={{display:'flex',justifyContent:'center',gap:14}}>
          {['Dati cifrati','Sessione sicura','Privacy protetta'].map((t,i)=>(
            <div key={i} style={{display:'flex',alignItems:'center',gap:4}}>
              <Ico n="check" s={11} c={C.success} sw={2.5}/>
              <span style={{fontSize:10,color:C.textMuted}}>{t}</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
};

/* ═══════════════════════════════════════════════════════
   VARIANTE B — Split Screen
   Pannello sinistro brand/stats, pannello destro form
═══════════════════════════════════════════════════════ */
const LoginB=({accent})=>{
  const [hovBtn,setHovBtn]=React.useState(false);
  const acc=accent||C.accent;
  return(
    <div style={{
      width:1440,height:900,display:'flex',overflow:'hidden',
      fontFamily:"'Space Grotesk',sans-serif",background:C.base,
    }}>

      {/* ── Left panel — Brand ── */}
      <div style={{
        width:'52%',position:'relative',overflow:'hidden',
        background:C.surface,borderRight:`1px solid ${C.border}`,
        display:'flex',flexDirection:'column',justifyContent:'space-between',
        padding:'56px 64px',
      }}>
        {/* Glow orb */}
        <div style={{
          position:'absolute',width:700,height:700,borderRadius:'50%',
          background:`radial-gradient(circle, rgba(240,114,40,0.10) 0%, transparent 65%)`,
          bottom:-200,left:-100,pointerEvents:'none',
        }}/>
        <div style={{
          position:'absolute',width:400,height:400,borderRadius:'50%',
          background:`radial-gradient(circle, rgba(240,114,40,0.06) 0%, transparent 65%)`,
          top:-50,right:-50,pointerEvents:'none',
        }}/>

        {/* Logo top */}
        <div style={{display:'flex',alignItems:'center',gap:12,position:'relative',zIndex:1}}>
          <div style={{
            width:42,height:42,borderRadius:12,
            background:`linear-gradient(135deg, #FF8A40 0%, #D05818 100%)`,
            display:'flex',alignItems:'center',justifyContent:'center',
            boxShadow:`0 6px 20px rgba(240,114,40,0.35)`,flexShrink:0,
          }}>
            <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2.2" strokeLinecap="round">
              <path d="M6 5v14M18 5v14M6 12h12M3 8h3M18 8h3M3 16h3M18 16h3"/>
            </svg>
          </div>
          <div>
            <div style={{fontSize:16,fontWeight:700,color:C.text,letterSpacing:'-0.015em'}}>Tracer</div>
            <div style={{fontSize:9,fontWeight:600,color:C.textMuted,letterSpacing:'0.12em',textTransform:'uppercase'}}>Workout Tracker</div>
          </div>
        </div>

        {/* Headline */}
        <div style={{position:'relative',zIndex:1}}>
          <div style={{
            display:'inline-flex',alignItems:'center',gap:6,padding:'5px 12px',
            background:C.acDim,border:`1px solid ${C.acMid}`,borderRadius:20,
            marginBottom:20,
          }}>
            <Ico n="zap" s={11} c={acc}/>
            <span style={{fontSize:11,fontWeight:600,color:acc}}>Powered by data</span>
          </div>
          <h1 style={{
            fontSize:48,fontWeight:800,color:C.text,
            letterSpacing:'-0.04em',lineHeight:1.1,marginBottom:16,
          }}>
            Traccia ogni<br/>
            <span style={{color:acc}}>progressione.</span>
          </h1>
          <p style={{fontSize:15,color:C.textSec,lineHeight:1.7,maxWidth:360}}>
            Storico allenamenti, analisi muscolare, trend di forza.<br/>Tutto in un posto solo.
          </p>
        </div>

        {/* Stats + heatmap */}
        <div style={{position:'relative',zIndex:1}}>
          <div style={{
            background:C.elevated,borderRadius:14,border:`1px solid ${C.border}`,
            padding:'20px 22px',marginBottom:16,
          }}>
            <div style={{fontSize:10,fontWeight:700,color:C.textMuted,letterSpacing:'0.1em',
              textTransform:'uppercase',marginBottom:12}}>Attività recente</div>
            <MiniHeatmap/>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:10}}>
            <Chip icon="fire" val="7" label="gg streak" color="240,114,40"/>
            <Chip icon="barChart" val="147" label="sessioni" color="61,214,140"/>
            <Chip icon="zap" val="35" label="serie ieri" color="91,158,255"/>
          </div>
        </div>
      </div>

      {/* ── Right panel — Form ── */}
      <div style={{
        flex:1,display:'flex',alignItems:'center',justifyContent:'center',
        padding:'56px 72px',background:C.base,
      }}>
        <div style={{width:'100%',maxWidth:380}}>

          <h2 style={{fontSize:28,fontWeight:700,color:C.text,letterSpacing:'-0.03em',marginBottom:8}}>
            Bentornato
          </h2>
          <p style={{fontSize:13.5,color:C.textMuted,marginBottom:36}}>
            Inserisci le credenziali per continuare.
          </p>

          <div style={{display:'flex',flexDirection:'column',gap:20,marginBottom:10}}>
            <Field label="Username" type="text" placeholder="Il tuo username" icon="user" accent={acc}/>
            <Field label="Password" type="password" placeholder="••••••••" icon="lock" accent={acc}/>
          </div>

          <div style={{textAlign:'right',marginBottom:28}}>
            <a href="#" style={{fontSize:11.5,color:C.textSec,textDecoration:'none',
              borderBottom:`1px solid ${C.border}`}}>Password dimenticata?</a>
          </div>

          <button
            onMouseEnter={()=>setHovBtn(true)}
            onMouseLeave={()=>setHovBtn(false)}
            style={{
              width:'100%',padding:'14px',display:'flex',alignItems:'center',
              justifyContent:'center',gap:8,
              background:hovBtn?'#D96420':acc,
              border:'none',borderRadius:10,
              fontSize:14.5,fontWeight:700,color:'#fff',cursor:'pointer',
              transition:'background 0.15s',
              boxShadow:`0 4px 20px rgba(240,114,40,0.30)`,
              letterSpacing:'-0.01em',
            }}>
            Entra in Tracer
            <Ico n="arrow" s={15} c="rgba(255,255,255,0.8)" sw={2}/>
          </button>

          <div style={{marginTop:28,display:'flex',alignItems:'center',gap:12}}>
            <div style={{flex:1,height:1,background:C.border}}/>
            <span style={{fontSize:10.5,color:C.textMuted}}>Accesso sicuro</span>
            <div style={{flex:1,height:1,background:C.border}}/>
          </div>
          <div style={{display:'flex',justifyContent:'center',gap:18,marginTop:16}}>
            {['Dati cifrati','Sessione sicura','Privacy protetta'].map((txt,i)=>(
              <div key={i} style={{display:'flex',alignItems:'center',gap:4}}>
                <Ico n="check" s={11} c={C.success} sw={2.5}/>
                <span style={{fontSize:10.5,color:C.textMuted}}>{txt}</span>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
};

/* ── App shell ── */
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "#F07228"
}/*EDITMODE-END*/;

const ACCENT_OPTS = ['#F07228','#5B9EFF','#3dd68c','#ab6cf7','#f43f5e'];

const App = () => {
  const [tweaks,setTweak] = useTweaks(TWEAK_DEFAULTS);
  return (
    <React.Fragment>
      <DesignCanvas>
        <DCSection id="s1" title="Variante A — Centered Premium">
          <DCArtboard id="a1" label="A — Centered Premium" width={1440} height={900}>
            <LoginA accent={tweaks.accent}/>
          </DCArtboard>
        </DCSection>
        <DCSection id="s2" title="Variante B — Split Screen">
          <DCArtboard id="a2" label="B — Split Screen" width={1440} height={900}>
            <LoginB accent={tweaks.accent}/>
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
      <TweaksPanel>
        <TweakSection label="Accento colore">
          <TweakColor label="Colore" value={tweaks.accent} options={ACCENT_OPTS}
            onChange={v=>setTweak('accent',v)}/>
        </TweakSection>
      </TweaksPanel>
    </React.Fragment>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
