<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Tracer — Redesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="tracer-shared.jsx"></script>
<script type="text/babel" src="tracer-v1.jsx"></script>
<script type="text/babel" src="tracer-v2.jsx"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body,#root{width:100%;height:100%;overflow:hidden;background:#080809}
  button,select,input{font-family:inherit}
</style>
</head>
<body>
<div id="root"></div>

<script type="application/json" id="__EDITMODE_DEFAULTS__">
{
  "accent": "#F07228",
  "variant": "Entrambe"
}
</script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "#F07228",
  "variant": "Entrambe"
}/*EDITMODE-END*/;

const ACCENT_OPTIONS = ['#F07228','#5B9EFF','#3dd68c','#ab6cf7','#f43f5e'];

const App = () => {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

  const t = {
    ...tweaks,
    accentDim: `rgba(240,114,40,0.10)`,
  };

  return (
    <React.Fragment>
      <DesignCanvas>
        <DCSection id="s1" title="Variante A — Raffinato">
          <DCArtboard id="a1" label="A — Raffinato" width={1440} height={900}>
            <TracerV1 tweaks={t}/>
          </DCArtboard>
        </DCSection>
        <DCSection id="s2" title="Variante B — Command Center">
          <DCArtboard id="a2" label="B — Command Center" width={1440} height={900}>
            <TracerV2 tweaks={t}/>
          </DCArtboard>
        </DCSection>
      </DesignCanvas>

      <TweaksPanel>
        <TweakSection label="Tema">
          <TweakColor
            label="Accento"
            value={tweaks.accent}
            options={ACCENT_OPTIONS}
            onChange={v => setTweak('accent', v)}
          />
        </TweakSection>
        <TweakSection label="Note di design">
          <div style={{fontSize:11,lineHeight:1.65,color:'#888',padding:'0 2px'}}>
            <div style={{marginBottom:8}}>
              <strong style={{color:'#bbb',display:'block',marginBottom:3}}>Variante A — Raffinato</strong>
              Stesso layout, tutto elevato: icone in sidebar, KPI strip, hover-reveal sulle azioni, tag limitati a 3+N.
            </div>
            <div>
              <strong style={{color:'#bbb',display:'block',marginBottom:3}}>Variante B — Command Center</strong>
              Sidebar a icone (+spazio), top bar persistente, KPI prominenti, layout a 2 colonne con heatmap e grafico affiancati alla lista.
            </div>
          </div>
        </TweakSection>
      </TweaksPanel>
    </React.Fragment>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
