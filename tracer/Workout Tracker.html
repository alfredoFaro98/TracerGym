<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tracer — Workout Tracker</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='2' y='20' width='10' height='24' rx='3' fill='%237c6ff7'/%3E%3Crect x='12' y='25' width='6' height='14' rx='2' fill='%237c6ff7'/%3E%3Crect x='18' y='28' width='28' height='8' rx='2' fill='%235a54c4'/%3E%3Crect x='46' y='25' width='6' height='14' rx='2' fill='%237c6ff7'/%3E%3Crect x='52' y='20' width='10' height='24' rx='3' fill='%237c6ff7'/%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: 'Space Grotesk', system-ui, sans-serif;
      background: #080809;
      color: #f0f0f3;
      -webkit-font-smoothing: antialiased;
    }
    #root { height: 100%; display: flex; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #22223a; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #303050; }

    /* Inputs / buttons global reset */
    input, textarea, select {
      font-family: 'Space Grotesk', system-ui, sans-serif;
      color: #f0f0f3;
      outline: none;
    }
    button { cursor: pointer; font-family: 'Space Grotesk', system-ui, sans-serif; }

    /* Page entrance */
    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(7px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .page-enter { animation: fadeSlideIn .22s ease forwards; }

    /* Remove number input arrows */
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }

    /* Touch */
    * { -webkit-tap-highlight-color: transparent; }
    button, a { touch-action: manipulation; }

    /* Sidebar / bottom nav */
    .tracer-bottom-nav { display: none; }
    @media (max-width: 640px) {
      .tracer-sidebar { display: none; }
      .tracer-bottom-nav { display: flex; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="workout-components.jsx"></script>
  <script type="text/babel" src="workout-app.jsx"></script>
</body>
</html>
