<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>401 - Non autorizzato · Tracer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #08080f; color: #f0f0f3; font-family: 'Inter', system-ui, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .wrap { text-align: center; padding: 40px 24px; }
  .code { font-size: 96px; font-weight: 800; color: #1a1a2e; font-family: 'JetBrains Mono', monospace; line-height: 1; margin-bottom: 8px; }
  .title { font-size: 20px; font-weight: 700; color: #e0e0f0; margin-bottom: 10px; }
  .desc { font-size: 13px; color: #484860; margin-bottom: 32px; line-height: 1.6; }
  .links { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .btn { display: inline-block; padding: 10px 22px; background: linear-gradient(135deg, #5a5aff, #8a4adf); border-radius: 8px; color: #fff; font-size: 13px; font-weight: 600; text-decoration: none; transition: opacity .15s; }
  .btn:hover { opacity: .85; }
  .btn-ghost { background: transparent; border: 1px solid #1c1c2c; color: #787890; }
  .btn-ghost:hover { opacity: 1; border-color: #3a3a5a; color: #f0f0f3; }
</style>
</head>
<body>
<div class="wrap">
  <div class="code">401</div>
  <div class="title">Non autorizzato</div>
  <div class="desc">Devi effettuare il login per accedere a questa risorsa.</div>
  <div class="links">
    <a href="/login/" class="btn">Accedi</a>
    <a href="/" class="btn btn-ghost">Home</a>
  </div>
</div>
</body>
</html>
