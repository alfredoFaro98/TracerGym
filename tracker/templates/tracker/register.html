{% extends 'tracker/base.html' %}

{% block title %}Registrati - Tracer Workout{% endblock %}

{% block content %}
<div style="flex: 1; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; height: 100vh;">
    <!-- Sfondo radiale -->
    <div style="position: absolute; width: 700px; height: 700px; background: radial-gradient(circle, rgba(var(--acc-rgb),.055) 0%, transparent 65%); top: 50%; left: 50%; transform: translate(-50%,-50%); pointer-events: none;"></div>
    
    <div class="page-enter responsive-card-width" style="width: 360px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 32px; z-index: 1;">
        
        <!-- Logo -->
        <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 26px;">
            <div style="width: 34px; height: 34px; border-radius: 9px; background: var(--acc); display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800; color: #fff;">T</div>
            <div>
                <div style="font-size: 16px; font-weight: 700; color: #f0f0f3;">Tracer</div>
                <div style="font-size: 9.5px; color: #f0f0f3; font-weight: 600; letter-spacing: 1px;">WORKOUT TRACKER</div>
            </div>
        </div>

        <!-- Mode tabs -->
        <div style="display: flex; gap: 4px; padding: 4px; background: var(--sunken); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 22px;">
            <a href="{% url 'login' %}" style="flex: 1; padding: 7px; border-radius: 5px; text-align: center; background: transparent; color: #f0f0f3; font-size: 13px;">Accedi</a>
            <div style="flex: 1; padding: 7px; border-radius: 5px; text-align: center; background: var(--surface-2); color: #f0f0f3; font-size: 13px; font-weight: 600;">Registrati</div>
        </div>

        <!-- Form -->
        <form method="post" style="display: flex; flex-direction: column; gap: 11px;">
            {% csrf_token %}
            
            {% for field in form %}
            <div>
                <label style="display: block; font-size: 10px; font-weight: 700; color: #f0f0f3; text-transform: uppercase; letter-spacing: .7px; margin-bottom: 6px;">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                <div style="font-size: 11px; color: #f85149; margin-top: 4px;">{{ field.errors.0 }}</div>
                {% endif %}
            </div>
            {% endfor %}

            <button type="submit" class="btn-primary-gradient" style="padding: 11px; margin-top: 3px; font-size: 14px;">Crea Account</button>
        </form>
    </div>
</div>

<script>
    // Aggiungiamo la classe tracer-input a tutti i campi generati da Django
    document.querySelectorAll("input").forEach(function(el) {
        if(el.type !== 'hidden' && el.type !== 'submit') {
            el.classList.add("tracer-input");
        }
    });
</script>
{% endblock %}
