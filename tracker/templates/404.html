<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Pagina non trovata · Tracer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    background:
      radial-gradient(circle at left center, rgba(124, 108, 246, 0.12) 0%, transparent 18%),
      radial-gradient(circle at center bottom, rgba(124, 108, 246, 0.08) 0%, transparent 30%),
      #132025;
    color: #f0f0f3;
  }
  .err-card {
    width: min(100%, 460px);
    background: var(--panel);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 22px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    padding: 48px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .err-icon {
    width: 72px;
    height: 72px;
    border-radius: 18px;
    background: rgba(124,108,246,0.14);
    border: 1px solid rgba(124,108,246,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 26px;
  }
  .err-code { font-family: 'Space Grotesk', sans-serif; font-size: 46px; font-weight: 700; color: #fff; line-height: 1; }
  .err-title { font-size: 19px; font-weight: 700; color: #fff; margin-top: 14px; }
  .err-desc { font-size: 14px; color: #9297a8; margin-top: 10px; line-height: 1.55; }
  .err-actions { display: flex; gap: 10px; margin-top: 30px; flex-wrap: wrap; justify-content: center; }
  .err-btn { font-size: 13.5px; font-weight: 700; border-radius: 10px; padding: 12px 22px; text-decoration: none; border: none; cursor: pointer; font-family: inherit; transition: transform .15s, box-shadow .15s, background .15s; }
  .err-btn-primary { color: #fff; background: #7c6cf6; box-shadow: 0 8px 20px rgba(124,108,246,0.35); }
  .err-btn-primary:hover { background: #8b7bf7; transform: translateY(-1px); }
  .err-btn-ghost { color: #c7cbd6; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); }
  .err-btn-ghost:hover { background: rgba(255,255,255,0.1); color: #fff; }
</style>
</head>
<body>
<div class="err-card">
  <div class="err-icon">
    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#a996ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="8" y1="8" x2="14" y2="14"></line><line x1="14" y1="8" x2="8" y2="14"></line></svg>
  </div>
  <div class="err-code">404</div>
  <div class="err-title">Pagina non trovata</div>
  <div class="err-desc">L'esercizio, la sessione o la pagina che cerchi non esiste o è stata spostata.</div>
  <div class="err-actions">
    <button type="button" class="err-btn err-btn-ghost" onclick="history.back()">Torna indietro</button>
    <a href="{% url 'dashboard' %}" class="err-btn err-btn-primary">Home</a>
  </div>
</div>
</body>
</html>
