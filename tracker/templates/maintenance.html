<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manutenzione · Tracer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    background:
      radial-gradient(circle at left center, rgba(124, 108, 246, 0.12) 0%, transparent 18%),
      radial-gradient(circle at center bottom, rgba(124, 108, 246, 0.08) 0%, transparent 30%),
      #08080c;
    color: #f0f0f3;
  }
  .err-card {
    width: min(100%, 460px);
    background: var(--panel);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 22px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    padding: 48px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .err-logo { font-family: 'Space Grotesk', sans-serif; font-size: 14px; font-weight: 700; color: #f0f0f3; margin-bottom: 28px; }
  .err-logo span { display: block; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 9px; color: #565b6e; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase; margin-top: 2px; }
  .err-icon {
    width: 72px;
    height: 72px;
    border-radius: 18px;
    background: rgba(124,108,246,0.14);
    border: 1px solid rgba(124,108,246,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 26px;
  }
  .err-title { font-size: 19px; font-weight: 700; color: #fff; }
  .err-desc { font-size: 14px; color: #9297a8; margin-top: 10px; line-height: 1.55; }
  .err-actions { display: flex; gap: 10px; margin-top: 30px; flex-wrap: wrap; justify-content: center; }
  .err-btn { font-size: 13.5px; font-weight: 700; border-radius: 10px; padding: 12px 22px; text-decoration: none; border: none; cursor: pointer; font-family: inherit; transition: transform .15s, box-shadow .15s, background .15s; }
  .err-btn-ghost { color: #c7cbd6; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); }
  .err-btn-ghost:hover { background: rgba(255,255,255,0.1); color: #fff; }
</style>
</head>
<body>
<div class="err-card">
  <div class="err-logo">Tracer<span>Workout Tracker</span></div>
  <div class="err-icon">
    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#a996ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg>
  </div>
  <div class="err-title">Manutenzione in corso</div>
  <div class="err-desc">Stiamo aggiornando Tracer per migliorarlo. Torneremo online a breve, grazie per la pazienza.</div>
  <div class="err-actions">
    <button type="button" class="err-btn err-btn-ghost" onclick="location.reload()">Controlla di nuovo</button>
  </div>
</div>
</body>
</html>
