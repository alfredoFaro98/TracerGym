<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>In aggiornamento · Tracer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #08080f; color: #f0f0f3; font-family: 'Inter', system-ui, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .wrap { text-align: center; padding: 40px 24px; max-width: 420px; }
  .logo { font-size: 15px; font-weight: 700; color: #f0f0f3; margin-bottom: 48px; letter-spacing: -.2px; }
  .logo span { font-size: 9px; color: #2a2a3e; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase; display: block; margin-top: 2px; }
  .icon { width: 56px; height: 56px; border-radius: 16px; background: linear-gradient(135deg, rgba(90,90,255,.15), rgba(138,74,223,.15)); border: 1px solid rgba(90,90,255,.2); display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; }
  .dots { display: flex; gap: 6px; justify-content: center; margin-bottom: 24px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #5a5aff; animation: pulse 1.4s ease-in-out infinite; }
  .dot:nth-child(2) { animation-delay: .2s; }
  .dot:nth-child(3) { animation-delay: .4s; }
  @keyframes pulse { 0%, 80%, 100% { opacity: .2; transform: scale(.8); } 40% { opacity: 1; transform: scale(1); } }
  .title { font-size: 20px; font-weight: 700; color: #e0e0f0; margin-bottom: 10px; }
  .desc { font-size: 13px; color: #484860; line-height: 1.7; }
  .badge { display: inline-block; margin-top: 32px; padding: 5px 14px; background: rgba(90,90,255,.08); border: 1px solid rgba(90,90,255,.18); border-radius: 20px; font-size: 11px; color: #7878c0; font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">Tracer <span>Workout Tracker</span></div>
  <div class="dots">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>
  <div class="title">App in aggiornamento</div>
  <div class="desc">Stiamo rilasciando una nuova versione.<br>Torna tra qualche minuto, sarà tutto pronto.</div>
  <div class="badge">Manutenzione in corso</div>
</div>
</body>
</html>
